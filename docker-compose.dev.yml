services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: status-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    networks:
      - statuspage
    volumes:
    - ./frontend:/app
    - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-status
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - statuspage
    develop:
      watch:
        - action: restart
          path: ./backend
          ignore:
            - node_modules/
            - "*.log"

  adminer:
    image: adminer:latest
    container_name: status-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - statuspage

  db:
    image: postgres:18-alpine
    container_name: status-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statuspage

  nginx:
    image: nginx:alpine
    container_name: nginx-status
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - statuspage

volumes:
  postgres_data:

networks:
  statuspage:
    driver: bridge